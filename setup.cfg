# Configuración de mutmut (mutation testing).
#
# NOTA PEDAGÓGICA: solo se mutan los módulos cuyo CÓDIGO REAL es ejercitado por
# las pruebas del equipo. Se EXCLUYE app/db_connector.py a propósito, porque es
# un stub que aún no está implementado (la BD no existe) y el Integrante 3 lo
# reemplaza por un Fake; mutarlo penalizaría al equipo por código que, por
# diseño, no se prueba de forma directa.
[mutmut]
paths_to_mutate=app/order_service.py,app/cli.py,app/payment_gateway.py
tests_dir=tests/
runner=python -m pytest -x -q
