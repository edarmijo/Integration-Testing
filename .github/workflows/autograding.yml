name: Autograding

# Se ejecuta en cada push a main y también se puede lanzar manualmente.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grade:
    name: Calcular nota (PyTest 20% + Mutation 80%)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio del equipo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar autoevaluación (0-100)
        run: python scripts/calculate_grade.py

      - name: Publicar reportes como artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-autoevaluacion
          path: |
            pytest-report.xml
            mutmut-report.xml
          if-no-files-found: ignore
